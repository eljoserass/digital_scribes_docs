<text x="32" y="378" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#00547a" font-weight="bold" text-anchor="start">Qué queremos conservar cambia según la tarea</text>
<rect x="32" y="416" width="529" height="157" rx="10" fill="#eff5f8" stroke="#00547a" stroke-width="1.5"/>
<text x="56" y="451" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#00547a" font-weight="bold" text-anchor="start">Encoder acústico para ASR</text>
<text x="56" y="489" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183747" font-weight="normal" text-anchor="start">Conservar evolución de los sonidos.</text>
<text x="56" y="524" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Secuencia de vectores → salida de texto.</text>
<rect x="603" y="416" width="556" height="157" rx="10" fill="#e5f3ec" stroke="#00547a" stroke-width="1.5"/>
<text x="627" y="451" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#00547a" font-weight="bold" text-anchor="start">Speaker encoder + pooling</text>
<text x="627" y="489" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183747" font-weight="normal" text-anchor="start">Resumir rasgos de voz de un segmento.</text>
<text x="627" y="524" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Muchos pasos → un vector para comparar voces.</text>
<text x="32" y="618" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#62747e" font-weight="normal" text-anchor="start">El dibujo no es audio ni un espectrograma real. Otras arquitecturas usan otra ruta.</text>
