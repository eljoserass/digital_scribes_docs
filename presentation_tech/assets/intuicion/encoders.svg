<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Encoder: del sonido a representaciones útiles</title><desc id="desc">El audio se transforma en características, patrones locales y vectores contextualizados. ASR conserva una secuencia temporal; un speaker encoder con pooling produce un vector por segmento para comparar voces.</desc>
