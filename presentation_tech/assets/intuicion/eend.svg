<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">EEND: predecir quién está activo en cada paso</title><desc id="desc">La red produce actividades por hablante y tiempo, con varias salidas altas para solapamiento. PIT compara permutaciones de los canales para que intercambiar S1 y S2 no sea un error de entrenamiento.</desc>
