<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Red neuronal y decoding: dos pasos distintos</title><desc id="desc">El decoder atiende al audio codificado y al texto previo, produce probabilidades, y greedy o beam search selecciona una secuencia. Un ejemplo numérico muestra que greedy puede perder la secuencia de mayor probabilidad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00547a"/></marker></defs>
<rect width="1120" height="620" fill="white"/>
<text x="32" y="43" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#00547a" font-weight="bold" text-anchor="start">Red neuronal y decoding: dos pasos distintos</text>
<rect x="32" y="108" width="236" height="82" rx="10" fill="#eff5f8" stroke="#00547a" stroke-width="1.5"/>
<text x="150" y="141" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#00547a" font-weight="bold" text-anchor="middle">Audio codificado</text>
<text x="150" y="172" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#62747e" font-weight="normal" text-anchor="middle">salida del encoder</text>
<rect x="32" y="217" width="236" height="82" rx="10" fill="#e5f3ec" stroke="#00547a" stroke-width="1.5"/>
<text x="150" y="250" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#00547a" font-weight="bold" text-anchor="middle">Texto previo</text>
<text x="150" y="282" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#183747" font-weight="normal" text-anchor="middle">«no refiere»</text>
<rect x="340" y="144" width="277" height="125" rx="10" fill="#eff5f8" stroke="#00547a" stroke-width="1.5"/>
<text x="478" y="181" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#00547a" font-weight="bold" text-anchor="middle">Decoder neuronal</text>
<text x="478" y="216" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183747" font-weight="normal" text-anchor="middle">atención + otras capas</text>
<text x="478" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="middle">calcula probabilidades</text>
<line x1="268" y1="149" x2="340" y2="185" stroke="#00547a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="268" y1="258" x2="340" y2="232" stroke="#00547a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="699" y="108" width="363" height="190" rx="10" fill="#e5f3ec" stroke="#00547a" stroke-width="1.5"/>
<text x="880" y="143" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#00547a" font-weight="bold" text-anchor="middle">Decoding</text>
<text x="728" y="184" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Greedy: una hipótesis</text>
<text x="728" y="216" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Beam: varias hipótesis</text>
<text x="728" y="264" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#00547a" font-weight="bold" text-anchor="start">→ seleccionar texto</text>
<line x1="617" y1="205" x2="699" y2="205" stroke="#00547a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="660" y="190" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#62747e" font-weight="normal" text-anchor="middle">P(token)</text>
<line x1="880" y1="298" x2="880" y2="330" stroke="#00547a" stroke-width="2"/>
<line x1="880" y1="330" x2="150" y2="330" stroke="#00547a" stroke-width="2"/>
<line x1="150" y1="330" x2="150" y2="299" stroke="#00547a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="508" y="352" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="middle">El texto elegido vuelve como prefijo para el siguiente paso.</text>
<rect x="32" y="388" width="1030" height="192" rx="10" fill="#eff5f8" stroke="#00547a" stroke-width="1.5"/>
<text x="56" y="423" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#00547a" font-weight="bold" text-anchor="start">Por qué greedy y la mejor secuencia pueden diferir</text>
<text x="56" y="463" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Ruta A: «tiene» (0,6) → «tos» (0,4) → fin (1)     producto = 0,24</text>
<text x="56" y="501" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">Ruta B: «niega» (0,4) → «tos» (0,9) → fin (1)     producto = 0,36</text>
<text x="56" y="547" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="start">Greedy empieza por A; un beam que conserve B puede recuperarla. Valores inventados.</text>
</svg>