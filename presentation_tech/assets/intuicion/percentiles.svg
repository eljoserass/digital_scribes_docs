<text x="32" y="644" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#62747e" font-weight="normal" text-anchor="start">Las cinco ejecuciones más lentas pueden superar p95; aquí una tarda 10 minutos.</text>
