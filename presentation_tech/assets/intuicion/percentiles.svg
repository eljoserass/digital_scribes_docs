<title id="title">p50 y p95: ordenar las esperas</title><desc id="desc">Cien latencias inventadas ordenadas: p50 sesenta segundos, p95 ciento ochenta segundos y máximo seiscientos segundos. El percentil noventa y cinco describe la cola sin ser el máximo.</desc>
