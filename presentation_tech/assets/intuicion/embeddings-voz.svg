<text x="442" y="291" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#183747" font-weight="normal" text-anchor="middle">+ pooling temporal</text>
<text x="442" y="337" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="middle">un vector por segmento</text>
