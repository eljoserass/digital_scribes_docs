<text x="56" y="550" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#00547a" font-weight="bold" text-anchor="start">Coseno: comparar la dirección de los vectores. Clustering: decidir qué agrupar.</text>
<text x="56" y="584" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183747" font-weight="normal" text-anchor="start">S1/S2 son grupos de voz; no dan nombres ni roles por sí solos.</text>
<text x="32" y="640" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#62747e" font-weight="normal" text-anchor="start">Plano 2D y colores ilustrativos: no son embeddings reales ni resultados del proyecto.</text>
