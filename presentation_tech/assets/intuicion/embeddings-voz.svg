<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Embeddings de voz: comparar segmentos</title><desc id="desc">Una red compartida transforma diferentes segmentos en vectores de voz. Vectores cercanos se agrupan en hablantes. El plano es un dibujo ilustrativo, no una proyección de datos reales.</desc>
