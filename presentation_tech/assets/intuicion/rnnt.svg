<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">RNN-T: dos formas de avanzar</title><desc id="desc">Un camino ilustrativo avanza por el audio al emitir blank y añade tokens sin avanzar el audio al emitir texto. El encoder y el predictor se combinan en el joiner.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00547a"/></marker></defs>
<rect width="1120" height="590" fill="white"/>
<text x="32" y="43" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#00547a" font-weight="bold" text-anchor="start">RNN-T: dos formas de avanzar</text>
<text x="32" y="77" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="start">Camino ilustrativo para «no hay tos»; no son tiempos medidos.</text>
<line x1="100" y1="408" x2="100" y2="174" stroke="#dce5e9" stroke-width="1"/>
