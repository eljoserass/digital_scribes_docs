<text x="912" y="367" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#00547a" font-weight="bold" text-anchor="middle">Joiner</text>
<line x1="1039" y1="158" x2="1090" y2="158" stroke="#00547a" stroke-width="2"/>
