<text x="390" y="441" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183747" font-weight="normal" text-anchor="middle">t3</text>
<line x1="535" y1="408" x2="535" y2="174" stroke="#dce5e9" stroke-width="1"/>
<text x="535" y="441" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183747" font-weight="normal" text-anchor="middle">t4</text>
<line x1="680" y1="408" x2="680" y2="174" stroke="#dce5e9" stroke-width="1"/>
<text x="680" y="441" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183747" font-weight="normal" text-anchor="middle">t5</text>
<line x1="100" y1="408" x2="680" y2="408" stroke="#dce5e9" stroke-width="1"/>
<text x="75" y="414" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="end">0</text>
