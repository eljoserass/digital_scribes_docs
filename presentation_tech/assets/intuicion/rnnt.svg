<text x="75" y="180" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#62747e" font-weight="normal" text-anchor="end">3</text>
<text x="360" y="477" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#00547a" font-weight="normal" text-anchor="middle">Pasos acústicos →</text>
