<text x="912" y="427" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#00547a" font-weight="bold" text-anchor="middle">¿Token o blank?</text>
<line x1="912" y1="391" x2="912" y2="402" stroke="#00547a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="545" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#00547a" font-weight="bold" text-anchor="start">Emitir texto actualiza el predictor. Emitir blank avanza el índice acústico.</text>
