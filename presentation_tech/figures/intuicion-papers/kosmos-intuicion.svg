<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc">
<title id="title">KOSMOS: hacer visibles entidades, atributos y relaciones</title><desc id="desc">El grafo se construye desde la consulta; no es la historia clínica recuperada de otro sistema.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#18394a"/></marker></defs>
<rect width="1280" height="630" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#18394a">
<text x="48" y="49" font-size="28" font-weight="bold">KOSMOS: hacer visibles entidades, atributos y relaciones</text>
<text x="48" y="80" font-size="17">El grafo se construye desde la consulta; no es la historia clínica recuperada de otro sistema.</text>
<rect x="48" y="115" width="370" height="172" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="66" y="148" font-size="20" font-weight="bold"><tspan x="66" dy="0">Transcripción con turnos</tspan></text><text x="66" y="183" font-size="17" font-weight="normal"><tspan x="66" dy="0">T4 · Paciente: «Antes tomaba</tspan><tspan x="66" dy="30">500 mg de metformina».</tspan><tspan x="66" dy="30">T9 · Médico: «Desde hoy,</tspan><tspan x="66" dy="30">1000 mg al día».</tspan></text><rect x="486" y="115" width="370" height="172" rx="14" fill="#e9f4ed" stroke="#18394a" stroke-width="1.5"/><text x="504" y="148" font-size="20" font-weight="bold"><tspan x="504" dy="0">Nodos con atributos</tspan></text><text x="504" y="183" font-size="17" font-weight="normal"><tspan x="504" dy="0">Metformina · régimen previo</tspan><tspan x="504" dy="30">dosis: 500 mg · fuente: T4</tspan><tspan x="504" dy="30">Metformina · régimen nuevo</tspan><tspan x="504" dy="30">dosis: 1000 mg/día · fuente: T9</tspan></text><line x1="418" y1="201" x2="486" y2="201" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="930" y="115" width="302" height="172" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="948" y="148" font-size="20" font-weight="bold"><tspan x="948" dy="0">Relaciones</tspan></text><text x="948" y="183" font-size="17" font-weight="normal"><tspan x="948" dy="0">Paciente → régimen previo</tspan><tspan x="948" dy="30">Médico → prescribe</tspan><tspan x="948" dy="30">           régimen nuevo</tspan></text><line x1="856" y1="201" x2="930" y2="201" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="270" y="366" width="760" height="143" rx="14" fill="#e9f4ed" stroke="#18394a" stroke-width="1.5"/><text x="288" y="399" font-size="20" font-weight="bold"><tspan x="288" dy="0">Generación conservando la transcripción</tspan></text><text x="288" y="434" font-size="17" font-weight="normal"><tspan x="288" dy="0">Texto original + nodos (o grafo) → nota con citas.</tspan><tspan x="288" dy="30">«Se modifica metformina a 1000 mg/día» [T9].</tspan><tspan x="288" dy="30">Comparar texto solo / texto + nodos / texto + grafo.</tspan></text><line x1="650" y1="287" x2="650" y2="366" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="48" y="562" font-size="21" font-weight="bold"><tspan x="48" dy="0">Separar dos regímenes evita mezclar una dosis antigua con un plan actual.</tspan></text><text x="48" y="597" font-size="15" font-weight="normal"><tspan x="48" dy="0">Esquema propio inspirado en KOSMOS; ejemplo ficticio, sin códigos UMLS ni extracción real.</tspan></text></g></svg>
