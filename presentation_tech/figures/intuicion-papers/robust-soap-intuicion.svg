<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="595" viewBox="0 0 1280 595" role="img" aria-labelledby="title desc">
<title id="title">Robust SOAP: comparar con gold y volver a la evidencia</title><desc id="desc">La nota de referencia ayuda a medir cobertura; la conversación ayuda a comprobar adiciones.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#18394a"/></marker></defs>
<rect width="1280" height="595" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#18394a">
<text x="48" y="49" font-size="28" font-weight="bold">Robust SOAP: comparar con gold y volver a la evidencia</text>
<text x="48" y="80" font-size="17">La nota de referencia ayuda a medir cobertura; la conversación ayuda a comprobar adiciones.</text>
<rect x="48" y="120" width="550" height="162" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="66" y="153" font-size="20" font-weight="bold"><tspan x="66" dy="0">¿Lo recoge la referencia?</tspan></text><text x="66" y="188" font-size="17" font-weight="normal"><tspan x="66" dy="0">Nota gold: «Tos de tres días».</tspan><tspan x="66" dy="30">Nota generada: «Tos de tres días, sin fiebre».</tspan><tspan x="66" dy="30">«Sin fiebre» no figura en el gold.</tspan></text><rect x="680" y="120" width="550" height="162" rx="14" fill="#e9f4ed" stroke="#18394a" stroke-width="1.5"/><text x="698" y="153" font-size="20" font-weight="bold"><tspan x="698" dy="0">¿Lo respalda la conversación?</tspan></text><text x="698" y="188" font-size="17" font-weight="normal"><tspan x="698" dy="0">Paciente: «Llevo tres días con tos.</tspan><tspan x="698" dy="30">No he tenido fiebre».</tspan><tspan x="698" dy="30">El dato extra sí tiene evidencia.</tspan></text><line x1="598" y1="202" x2="680" y2="202" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="48" y="334" font-size="26" font-weight="bold"><tspan x="48" dy="0">Ausente del gold ≠ inventado</tspan></text><text x="48" y="372" font-size="19" font-weight="normal"><tspan x="48" dy="0">La segunda comparación separa elaboración válida de contenido sin respaldo.</tspan></text><rect x="48" y="411" width="550" height="115" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="66" y="444" font-size="20" font-weight="bold"><tspan x="66" dy="0">Si falta evidencia</tspan></text><text x="66" y="479" font-size="17" font-weight="normal"><tspan x="66" dy="0">«Auscultación normal» sin exploración documentada:</tspan><tspan x="66" dy="30">contenido no respaldado.</tspan></text><rect x="680" y="411" width="550" height="115" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="698" y="444" font-size="20" font-weight="bold"><tspan x="698" dy="0">Si la contradice</tspan></text><text x="698" y="479" font-size="17" font-weight="normal"><tspan x="698" dy="0">«Tiene fiebre» frente a «No he tenido fiebre»:</tspan><tspan x="698" dy="30">conflicto con la conversación.</tspan></text><text x="48" y="567" font-size="15" font-weight="normal"><tspan x="48" dy="0">Ejemplo propio para explicar el protocolo de dos fases de Latif et al. (2026).</tspan></text></g></svg>
