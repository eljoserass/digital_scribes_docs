<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">ASCRIBE: explicitar qué información conservar</title><desc id="desc">Tailandés: hechos atómicos, evidencia y seis niveles de relevancia antes de generar la nota.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#18394a"/></marker></defs>
<rect width="1280" height="620" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#18394a">
<text x="48" y="49" font-size="28" font-weight="bold">ASCRIBE: explicitar qué información conservar</text>
<text x="48" y="80" font-size="17">Tailandés: hechos atómicos, evidencia y seis niveles de relevancia antes de generar la nota.</text>
<rect x="48" y="120" width="335" height="148" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="66" y="153" font-size="20" font-weight="bold"><tspan x="66" dy="0">1 · Conversación</tspan></text><text x="66" y="188" font-size="17" font-weight="normal"><tspan x="66" dy="0">Hechos dispersos en turnos.</tspan><tspan x="66" dy="30">Ejemplo: «Me salió una</tspan><tspan x="66" dy="30">reacción al tomar X».</tspan></text><rect x="447" y="120" width="380" height="148" rx="14" fill="#e9f4ed" stroke="#18394a" stroke-width="1.5"/><text x="465" y="153" font-size="20" font-weight="bold"><tspan x="465" dy="0">2 · Hecho + fuente + relevancia</tspan></text><text x="465" y="188" font-size="17" font-weight="normal"><tspan x="465" dy="0">«Refiere reacción tras X».</tspan><tspan x="465" dy="30">Conservar el fragmento de soporte.</tspan><tspan x="465" dy="30">Asignar relevancia clínica.</tspan></text><rect x="890" y="120" width="340" height="148" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="908" y="153" font-size="20" font-weight="bold"><tspan x="908" dy="0">3 · Nota</tspan></text><text x="908" y="188" font-size="17" font-weight="normal"><tspan x="908" dy="0">Generar SOAP usando el</tspan><tspan x="908" dy="30">diálogo y los hechos previos.</tspan><tspan x="908" dy="30">No diagnosticar por defecto.</tspan></text><line x1="383" y1="195" x2="447" y2="195" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><line x1="827" y1="195" x2="890" y2="195" stroke="#18394a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="48" y="316" font-size="24" font-weight="bold"><tspan x="48" dy="0">Dos usos del mismo formato</tspan></text><rect x="48" y="353" width="550" height="152" rx="14" fill="#e8f1f5" stroke="#18394a" stroke-width="1.5"/><text x="66" y="386" font-size="20" font-weight="bold"><tspan x="66" dy="0">Prompting: pedir esa secuencia</tspan></text><text x="66" y="421" font-size="17" font-weight="normal"><tspan x="66" dy="0">Instrucciones → hechos + etiquetas → nota.</tspan><tspan x="66" dy="30">No se modifican los pesos del modelo.</tspan><tspan x="66" dy="30">Se compara con pedir directamente SOAP.</tspan></text><rect x="680" y="353" width="550" height="152" rx="14" fill="#e9f4ed" stroke="#18394a" stroke-width="1.5"/><text x="698" y="386" font-size="20" font-weight="bold"><tspan x="698" dy="0">Entrenamiento: puntuar y actualizar</tspan></text><text x="698" y="421" font-size="17" font-weight="normal"><tspan x="698" dy="0">Varias salidas → rewards → actualización GRPO.</tspan><tspan x="698" dy="30">Puntuar hechos, relevancia, completitud,</tspan><tspan x="698" dy="30">respaldo y estructura SOAP.</tspan></text><text x="48" y="552" font-size="20" font-weight="bold"><tspan x="48" dy="0">El juez da una señal de entrenamiento; no convierte sus decisiones en verdad clínica.</tspan></text><text x="48" y="589" font-size="15" font-weight="normal"><tspan x="48" dy="0">Esquema propio del método ASCRIBE (Kalavantavanich et al., 2026). Ejemplo ficticio.</tspan></text></g></svg>
