<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
<title id="title">Respaldo y cobertura son comprobaciones diferentes</title><desc id="desc">Una comprobación parte de las afirmaciones de la nota y busca su evidencia. Otra parte de hechos relevantes esperados y pregunta si se conservaron en la nota. Las omisiones no se encuentran revisando solo lo escrito.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#314a68"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.h{font-size:27px;font-weight:bold}.b{font-size:23px;font-weight:bold}.s{font-size:21px}.xs{font-size:19px}.arr{fill:none;stroke:#314a68;stroke-width:3;marker-end:url(#arrow)}.box{stroke:#c9d5df;stroke-width:2;rx:13}</style>
<rect width="1260" height="650" fill="#fff"/><text x="35" y="47" class="h">Dos direcciones de comprobación</text>
<text x="35" y="105" class="b">1. ¿Lo escrito tiene respaldo?</text>
<rect x="35" y="132" width="315" height="164" fill="#e9f0f8" class="box"/><text x="55" y="165" class="b">Afirmaciones de la nota</text><text x="55" y="202" class="s">«Tos de tres días»</text><text x="55" y="238" class="s">«Tiene fiebre»</text><text x="55" y="273" class="s">«Auscultación normal»</text>
<rect x="440" y="132" width="335" height="164" fill="#f9f0df" class="box"/><text x="461" y="166" class="b">Buscar y contrastar</text><text x="461" y="204" class="s">Conversación + historia</text><text x="461" y="239" class="s">+ observaciones disponibles</text><text x="461" y="272" class="xs">Puede implementarse con un LLM.</text>
<rect x="865" y="132" width="355" height="164" fill="#f1f5f8" class="box"/><text x="886" y="167" class="b">Señales para revisar</text><text x="886" y="204" class="s" fill="#14735e">Tos → respaldada</text><text x="886" y="239" class="s" fill="#a33a3a">Fiebre → contradicción</text><text x="886" y="273" class="s">Auscultación → sin evidencia</text><path d="M350 213H435" class="arr"/><path d="M775 213H860" class="arr"/>
<text x="35" y="353" class="b">2. ¿Falta algo que debía documentarse?</text>
<rect x="35" y="378" width="360" height="127" fill="#eaf3ef" class="box"/><text x="55" y="416" class="b">Hechos relevantes esperados</text><text x="55" y="454" class="s">«Erupción con amoxicilina»</text><text x="55" y="485" class="xs">Selección acordada con clínicos.</text>
<rect x="470" y="378" width="355" height="127" fill="#f9f0df" class="box"/><text x="490" y="417" class="b">Comprobar cobertura</text><text x="490" y="455" class="s">¿Aparece con significado fiel?</text><text x="490" y="485" class="xs">No requiere la misma redacción.</text>
<rect x="900" y="378" width="320" height="127" fill="#fbeeed" class="box"/><text x="920" y="419" class="b">Omisión detectada</text><text x="920" y="456" class="s">La reacción no está escrita.</text><path d="M395 442H465" class="arr"/><path d="M825 442H895" class="arr"/>
<rect x="35" y="552" width="1185" height="68" rx="10" fill="#e9f0f8"/><text x="55" y="580" class="s">Todas las frases pueden estar respaldadas y aun así faltar información importante.</text><text x="55" y="608" class="xs">El propio verificador necesita evaluación con ejemplos anotados; su veredicto no certifica verdad clínica.</text>
</svg>
