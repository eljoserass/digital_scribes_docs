<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="710" viewBox="0 0 1260 710" role="img" aria-labelledby="title desc">
<title id="title">Qué evalúan médicos, métricas, calibración y jueces LLM</title><desc id="desc">SCRIBE usa puntuaciones humanas, métricas automáticas, una combinación de métricas aprendida para aproximar humanos y un LLM que puntúa una rúbrica. Entrenar el calibrador no es entrenar el generador ni el LLM juez.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#314a68"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.h{font-size:27px;font-weight:bold}.b{font-size:23px;font-weight:bold}.s{font-size:21px}.xs{font-size:19px}.arr{fill:none;stroke:#314a68;stroke-width:3;marker-end:url(#arrow)}.box{stroke:#c9d5df;stroke-width:2;rx:12}</style>
<rect width="1260" height="710" fill="#fff"/><text x="35" y="47" class="h">SCRIBE: varias señales sobre las mismas notas</text>
<rect x="35" y="88" width="370" height="101" fill="#eaf3ef" class="box"/><text x="55" y="125" class="b">Médicos + rúbrica + fuentes</text><text x="55" y="163" class="s">Criterios acordados y revisión clínica</text><rect x="925" y="88" width="295" height="101" fill="#eaf3ef" class="box"/><text x="945" y="125" class="b">Puntuación humana</text><text x="945" y="163" class="s">Por dimensión, 1–5</text><path d="M405 139H920" class="arr"/>
<rect x="35" y="220" width="370" height="101" fill="#e9f0f8" class="box"/><text x="55" y="257" class="b">Nota + referencia</text><text x="55" y="295" class="s">Comparar texto y otras propiedades</text><rect x="455" y="220" width="370" height="101" fill="#e9f0f8" class="box"/><text x="475" y="257" class="b">Métricas automáticas</text><text x="475" y="295" class="s">ROUGE · BERTScore · perplexity…</text><rect x="925" y="220" width="295" height="101" fill="#e9f0f8" class="box"/><text x="945" y="257" class="b">Vector de señales</text><text x="945" y="295" class="s">Señales parciales de calidad</text><path d="M405 270H450" class="arr"/><path d="M825 270H920" class="arr"/>
<rect x="35" y="352" width="370" height="126" fill="#f9f0df" class="box"/><text x="55" y="389" class="b">Métricas + etiquetas humanas</text><text x="55" y="427" class="s">Ejemplos para aprender pesos</text><text x="55" y="457" class="xs">Separar ajuste y evaluación nueva.</text><rect x="455" y="352" width="370" height="126" fill="#f9f0df" class="box"/><text x="475" y="389" class="b">Calibrador supervisado</text><text x="475" y="427" class="s">Pesos aprendidos para métricas</text><text x="475" y="457" class="xs">Entrenan este mapeo, no el LLM.</text><rect x="925" y="352" width="295" height="126" fill="#f9f0df" class="box"/><text x="945" y="390" class="b">Puntuación estimada</text><text x="945" y="427" class="s">Aproximar al médico</text><text x="945" y="457" class="xs">Probar en nuevos casos.</text><path d="M405 414H450" class="arr"/><path d="M825 414H920" class="arr"/>
<rect x="35" y="511" width="370" height="101" fill="#eef0f8" class="box"/><text x="55" y="548" class="b">Nota + rúbrica + referencia</text><text x="55" y="586" class="s">Prompt que define qué puntuar</text><rect x="455" y="511" width="370" height="101" fill="#eef0f8" class="box"/><text x="475" y="548" class="b">LLM juez</text><text x="475" y="586" class="s">Lee y aplica los criterios</text><rect x="925" y="511" width="295" height="101" fill="#eef0f8" class="box"/><text x="945" y="548" class="s">Puntuación y explicación</text><text x="945" y="586" class="s">También puede equivocarse</text><path d="M405 560H450" class="arr"/><path d="M825 560H920" class="arr"/>
<text x="35" y="661" class="s">Esquema propio basado en Wang et al. (2025), Methods y tabla 2. No es una figura original del paper.</text>
</svg>
