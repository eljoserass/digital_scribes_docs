<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="690" viewBox="0 0 1260 690" role="img" aria-labelledby="title desc">
<title id="title">Generar directamente o mediante hechos intermedios</title><desc id="desc">El diálogo del encuentro y el contexto recuperado alimentan dos alternativas: generación directa o extracción de hechos antes de generar. La historia externa y los hechos extraídos de la conversación son cosas distintas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#314a68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172f4e} .h{font-size:27px;font-weight:bold}.b{font-size:22px;font-weight:bold}.s{font-size:20px}.xs{font-size:18px}.box{stroke:#c9d5df;stroke-width:2;rx:14}.arr{fill:none;stroke:#314a68;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1260" height="690" fill="#fff"/>
<text x="35" y="47" class="h">La misma información, dos maneras de construir la nota</text>
<rect x="35" y="88" width="280" height="112" class="box" fill="#eaf3ef"/><text x="55" y="119" class="b">Historia del paciente</text><text x="55" y="150" class="s">Seleccionar registros</text><text x="55" y="179" class="xs">paciente · fecha · procedencia</text>
<rect x="350" y="105" width="830" height="80" class="box" fill="#f1f5f8"/><text x="375" y="138" class="b">Contexto recuperado: lo que sabemos de antes</text><text x="375" y="166" class="s">Puede contener información que no se repite en el audio.</text><path d="M315 145H345" class="arr"/>
<rect x="35" y="250" width="280" height="200" class="box" fill="#e9f0f8"/><text x="55" y="285" class="b">Encuentro actual</text><text x="55" y="320" class="s">Conversación</text><text x="55" y="352" class="s">Observaciones de hoy</text><text x="55" y="398" class="xs">«Lo dejé hace dos semanas»</text><text x="55" y="426" class="xs">puede actualizar la historia.</text>
<text x="380" y="239" class="b">A. Directa</text><rect x="380" y="263" width="290" height="105" class="box" fill="#eaf3ef"/><text x="405" y="301" class="b">Generador</text><text x="405" y="338" class="s">diálogo + contexto + plantilla</text><rect x="910" y="263" width="265" height="105" class="box" fill="#f1f5f8"/><text x="943" y="310" class="b">Borrador de nota</text><text x="943" y="340" class="xs">Selección y redacción juntas</text><path d="M315 299H375" class="arr"/><path d="M670 315H905" class="arr"/><path d="M530 185V257" class="arr"/>
<text x="380" y="432" class="b">B. Con hechos intermedios</text><rect x="380" y="455" width="270" height="115" class="box" fill="#f9f0df"/><text x="400" y="492" class="b">Extraer hechos</text><text x="400" y="526" class="s">sujeto · estado · fuente</text><text x="400" y="554" class="xs">«paciente · suspendió X · t2»</text><rect x="700" y="455" width="170" height="115" class="box" fill="#eaf3ef"/><text x="720" y="497" class="b">Generador</text><text x="720" y="533" class="xs">hechos + diálogo</text><rect x="920" y="455" width="255" height="115" class="box" fill="#f1f5f8"/><text x="940" y="501" class="b">Borrador de nota</text><text x="940" y="539" class="xs">La extracción también falla.</text><path d="M315 410H347V510H375" class="arr"/><path d="M650 510H695" class="arr"/><path d="M870 510H915" class="arr"/><path d="M1180 145H1210V590H515V575" class="arr"/>
<rect x="35" y="611" width="1140" height="52" rx="10" fill="#e9f0f8"/><text x="55" y="644" class="s">Recuperar historia ≠ extraer hechos del encuentro. Una estructura inspeccionable no garantiza fidelidad.</text>
</svg>
